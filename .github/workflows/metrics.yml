name: Metrics

on:
  # Run automatically every day at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  # Allows manual trigger anytime in the Actions tab
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: felipe-godoi
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          config_order: base.header, isocalendar, languages, lines
          filename: assets/github-metrics.svg
          output_action: commit
          committer_message: "chore: update github metrics [skip ci]"

          # Lines of code plugin (tracks additions & deletions across repos)
          plugin_lines: yes
          plugin_lines_history_limit: 2
          plugin_lines_repositories_limit: 4

          # Languages breakdown plugin
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # Contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
