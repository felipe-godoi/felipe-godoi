name: Update GitHub Stats Cards

on:
  # Run daily at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  # Allows manual execution anytime in the Actions tab
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Generate the overall stats card (including private repositories & commits)
      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1
        with:
          card: stats
          options: "username=felipe-godoi&show_icons=true&include_all_commits=true&count_private=true&theme=radical&hide_border=true&bg_color=080d1a&title_color=7c6de9&icon_color=7c6de9&text_color=94a3b8"
          path: assets/github-stats.svg
          token: ${{ secrets.METRICS_TOKEN }}

      # 2. Generate the compact top languages card
      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "username=felipe-godoi&layout=compact&langs_count=6&theme=radical&hide_border=true&bg_color=080d1a&title_color=7c6de9&text_color=94a3b8"
          path: assets/github-top-langs.svg
          token: ${{ secrets.METRICS_TOKEN }}

      # 3. Commit and push the generated SVGs
      - name: Commit and push generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-top-langs.svg
          git commit -m "chore: update github stats cards [skip ci]" || exit 0
          git push
